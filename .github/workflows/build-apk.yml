name: Build DXF2DWG APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 写入布局文件
        run: |
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="DXF → DWG 转换器"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="30dp"/>
              <Button
                  android:id="@+id/btn_pick"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="选择 DXF 文件"/>
              <Button
                  android:id="@+id/btn_convert"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="开始转换"
                  android:layout_marginTop="12dp"
                  android:enabled="false"/>
              <TextView
                  android:id="@+id/tv_status"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:text="请先选择文件"
                  android:textSize="14sp"/>
          </LinearLayout>
          EOF

      - name: 写入 MainActivity.java
        run: |
          mkdir -p app/src/main/java/com/example/dxf2dwg
          cat > app/src/main/java/com/example/dxf2dwg/MainActivity.java << 'EOF'
          package com.example.dxf2dwg;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  Button btnPick = findViewById(R.id.btn_pick);
                  Button btnConvert = findViewById(R.id.btn_convert);
                  TextView tvStatus = findViewById(R.id.tv_status);
                  btnPick.setOnClickListener(v -> {
                      tvStatus.setText("演示版：已选择 sample.dxf");
                      btnConvert.setEnabled(true);
                      Toast.makeText(this, "请放置真实 DXF 文件到手机存储", Toast.LENGTH_SHORT).show();
                  });
                  btnConvert.setOnClickListener(v -> {
                      tvStatus.setText("转换完成！\n（演示版 - 完整版需集成 ODA 库）");
                      Toast.makeText(this, "DWG 已保存到下载文件夹", Toast.LENGTH_LONG).show();
                  });
              }
          }
          EOF

      - name: 写入构建文件
        run: |
          mkdir -p app
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 30
              buildToolsVersion "30.0.3"
              defaultConfig {
                  applicationId "com.example.dxf2dwg"
                  minSdkVersion 21
                  targetSdkVersion 30
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          }
          dependencies {}
          EOF
          
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:4.1.3'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: 安装 Gradle 并生成 Wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle wrapper --gradle-version 7.0
          chmod +x ./gradlew

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 编译 APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
